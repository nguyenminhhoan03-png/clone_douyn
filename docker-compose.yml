version: '3.8'

services:
  # Chạy server Backend API
  backend:
    build: .
    image: douyin-app-image:latest
    container_name: douyin_backend
    restart: always
    ports:
      - "8000:8000"
    command: ["python", "run_backend.py"]
    environment:
      - HEADLESS=true
    volumes:
      - ./config:/app/config
      - ./database:/app/database
      - ./.env:/app/.env

  # Chạy Tool Auto Crawl & Upload ngầm 24/7
  worker:
    image: douyin-app-image:latest
    container_name: douyin_worker
    restart: always
    command: ["python", "main.py", "auto", "--file", "urls.txt"]
    environment:
      - HEADLESS=true
    volumes:
      - ./config:/app/config
      - ./database:/app/database
      - ./.env:/app/.env
      - ./music:/app/music
      - ./logs:/app/logs
      - ./downloads:/app/downloads
      - ./processed:/app/processed
      - ./urls.txt:/app/urls.txt
